name: Scan feeds

on:
  schedule:
    # Every 4 hours, on the hour (UTC). GitHub cron is best-effort and may lag.
    - cron: '0 */4 * * *'
  # Allow running it by hand from the Actions tab or via the admin UI (dispatch).
  workflow_dispatch:
    inputs:
      feed_id:
        description: 'Scan only this feed id (blank = all active feeds)'
        required: false
        default: ''
      scan_run_id:
        description: 'Existing scan_runs row id to update (blank = create a new one)'
        required: false
        default: ''

# Never let two scans overlap; a new run waits rather than racing the DB.
concurrency:
  group: scan-feeds
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run scan
        run: npm run scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # Empty on cron runs; set when dispatched from the admin UI.
          SCAN_FEED_ID: ${{ github.event.inputs.feed_id }}
          SCAN_RUN_ID: ${{ github.event.inputs.scan_run_id }}
